<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Registro · Natillas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  min-height:100vh;background:#000;color:#f5f5f7;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  display:flex;justify-content:center;padding:16px;
}
.app{width:min(100%,440px)}
h1{font-size:24px;font-weight:800;letter-spacing:-.3px}
.sub{font-size:13px;color:#8e8e93;margin:4px 0 14px;line-height:1.4}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{
  background:#1c1c1e;border:1px solid #2c2c2e;border-radius:14px;padding:12px;
}
.stat b{display:block;font-size:18px;font-weight:800;margin-bottom:2px}
.stat span{font-size:11px;color:#8e8e93}
.stat.blue b{color:#0a84ff}
.stat.orange b{color:#ff9f0a}
.stat.green b{color:#30d158}
.stat.purple b{color:#bf5af2}

.card{
  background:#1c1c1e;border:1px solid #2c2c2e;border-radius:18px;
  padding:14px;margin-bottom:12px;
}
.card h2{font-size:15px;font-weight:700;margin-bottom:10px}
label{display:block;font-size:11px;color:#8e8e93;font-weight:600;margin:8px 0 5px}
input,textarea{
  width:100%;background:#2c2c2e;border:1px solid #2c2c2e;color:#fff;
  border-radius:12px;padding:12px;font-size:15px;outline:none;
}
input:focus,textarea:focus{border-color:#0a84ff}
textarea{min-height:60px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.btn{
  width:100%;border:none;border-radius:12px;padding:13px;margin-top:10px;
  background:#0a84ff;color:#fff;font-size:15px;font-weight:700;cursor:pointer;
}
.btn.gray{background:#2c2c2e}
.btn.red{background:#ff453a}
.btn.small{width:auto;margin:0;padding:8px 12px;font-size:12px}
.btn:disabled{opacity:.5}

.msg{
  display:none;margin-top:8px;padding:10px;border-radius:10px;
  font-size:12px;text-align:center;
}
.msg.ok{display:block;background:rgba(48,209,88,.12);color:#30d158}
.msg.err{display:block;background:rgba(255,69,58,.12);color:#ff453a}

.search{
  width:100%;background:#1c1c1e;border:1px solid #2c2c2e;color:#fff;
  border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px;outline:none;
}

.list{display:flex;flex-direction:column;gap:10px}
.item{
  background:#111113;border:1px solid #2a2a2e;border-radius:16px;padding:12px;
}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.name{font-size:16px;font-weight:800}
.badge{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px}
.badge.green{background:rgba(48,209,88,.15);color:#30d158}
.badge.orange{background:rgba(255,159,10,.15);color:#ff9f0a}
.badge.red{background:rgba(255,69,58,.15);color:#ff453a}
.meta{margin-top:8px;font-size:12px;color:#a1a1a6;line-height:1.55}
.meta b{color:#fff}
.note{margin-top:6px;font-size:12px;color:#8e8e93;font-style:italic}
.actions{display:flex;gap:8px;margin-top:10px}
.empty{text-align:center;color:#8e8e93;font-size:13px;padding:20px}
.foot{text-align:center;color:#6c6c70;font-size:11px;padding:12px 0 22px}
.price-tag{font-size:12px;color:#8e8e93;margin-bottom:8px}
.price-tag b{color:#ffd60a}
</style>
</head>
<body>
<div class="app">
  <h1>Registro</h1>
  <p class="sub">Natillas · control de ventas, pagos y deudas. Precio fijo por unidad: <b style="color:#ffd60a">$2.500</b></p>

  <div class="stats">
    <div class="stat blue"><b id="stReparto">0</b><span>Unidades repartidas</span></div>
    <div class="stat orange"><b id="stPorPagar">0</b><span>Unidades por pagar</span></div>
    <div class="stat green"><b id="stCompletas">0</b><span>Vendidas / pagadas</span></div>
    <div class="stat purple"><b id="stGanancia">$0</b><span>Ganancia (cobrado)</span></div>
  </div>

  <div class="card">
    <h2 id="formTitle">Nueva venta</h2>
    <p class="price-tag">Cada natilla = <b>$2.500</b></p>
    <input type="hidden" id="editId" value="">

    <label>Nombre</label>
    <input id="nombre" placeholder="Ej. Iván" autocomplete="off">

    <div class="row">
      <div>
        <label>Unidades</label>
        <input id="unidades" type="number" min="0" step="1" placeholder="5" inputmode="numeric">
      </div>
      <div>
        <label>Total pedido</label>
        <input id="totalView" type="text" value="$0" readonly style="opacity:.85">
      </div>
    </div>

    <div class="row">
      <div>
        <label>Pagó</label>
        <input id="pago" type="number" min="0" step="100" placeholder="0" inputmode="numeric">
      </div>
      <div>
        <label>Debe</label>
        <input id="debe" type="number" min="0" step="100" placeholder="0" inputmode="numeric">
      </div>
    </div>

    <label>Nota (opcional)</label>
    <textarea id="nota" placeholder="Ej. pagó una y media..."></textarea>

    <button class="btn" id="btnSave" type="button">Guardar registro</button>
    <button class="btn gray" id="btnCancel" type="button" style="display:none">Cancelar</button>
    <div class="msg" id="msg"></div>
  </div>

  <input class="search" id="search" placeholder="Buscar por nombre...">
  <div class="list" id="list"></div>
  <div class="foot">Registro Natillas · datos guardados en este dispositivo</div>
</div>

<script>
(function () {
  var PRICE = 2500;
  var KEY = "natillas_registro_v2";
  var data = [];
  var filter = "";

  function $(id) { return document.getElementById(id); }

  function loadData() {
    try {
      var raw = localStorage.getItem(KEY);
      data = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(data)) data = [];
    } catch (e) {
      data = [];
      showMsg("No se pudo leer el almacenamiento local", true);
    }
  }

  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify(data));
      // verificación
      var check = localStorage.getItem(KEY);
      if (!check) throw new Error("sin espacio o bloqueado");
      return true;
    } catch (e) {
      showMsg("Error al guardar. Prueba abrir la página en Chrome (https o archivo local).", true);
      return false;
    }
  }

  function n(v) {
    var x = parseFloat(String(v).replace(",", "."));
    return isNaN(x) ? 0 : x;
  }

  function money(v) {
    return "$" + Math.round(n(v)).toLocaleString("es-CO");
  }

  function showMsg(text, err) {
    var el = $("msg");
    el.textContent = text;
    el.className = "msg " + (err ? "err" : "ok");
    setTimeout(function () {
      el.className = "msg";
      el.textContent = "";
    }, 2200);
  }

  function escapeHtml(s) {
    return String(s || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function statusOf(r) {
    var debe = n(r.debe);
    var pago = n(r.pago);
    var total = n(r.unidades) * PRICE;
    if (debe <= 0 && pago >= total && total > 0) return "paid";
    if (pago <= 0 && debe > 0) return "unpaid";
    if (debe > 0) return "debt";
    if (pago > 0 && pago < total) return "debt";
    if (total === 0) return "unpaid";
    return "paid";
  }

  function badge(st) {
    if (st === "paid") return '<span class="badge green">Pagó completo</span>';
    if (st === "debt") return '<span class="badge orange">Debe</span>';
    return '<span class="badge red">No pagado</span>';
  }

  function updateTotalView() {
    var u = n($("unidades").value);
    $("totalView").value = money(u * PRICE);
  }

  // Si escriben pago, sugiere debe automáticamente (se puede editar)
  function suggestDebe() {
    var total = n($("unidades").value) * PRICE;
    var pago = n($("pago").value);
    var debe = Math.max(0, total - pago);
    $("debe").value = debe ? String(debe) : "0";
  }

  function clearForm() {
    $("editId").value = "";
    $("nombre").value = "";
    $("unidades").value = "";
    $("pago").value = "";
    $("debe").value = "";
    $("nota").value = "";
    $("totalView").value = "$0";
    $("formTitle").textContent = "Nueva venta";
    $("btnSave").textContent = "Guardar registro";
    $("btnCancel").style.display = "none";
  }

  function stats() {
    var reparto = 0, porPagar = 0, completas = 0, ganancia = 0;
    for (var i = 0; i < data.length; i++) {
      var r = data[i];
      var u = n(r.unidades);
      var st = statusOf(r);
      reparto += u;
      ganancia += n(r.pago);
      if (st === "paid") completas += u;
      else porPagar += u;
    }
    $("stReparto").textContent = reparto;
    $("stPorPagar").textContent = porPagar;
    $("stCompletas").textContent = completas;
    $("stGanancia").textContent = money(ganancia);
  }

  function render() {
    stats();
    var q = filter.trim().toLowerCase();
    var rows = data.slice().sort(function (a, b) { return b.ts - a.ts; });
    if (q) {
      rows = rows.filter(function (r) {
        return String(r.nombre || "").toLowerCase().indexOf(q) !== -1;
      });
    }

    if (!rows.length) {
      $("list").innerHTML = '<div class="card empty">Sin registros aún. Guarda la primera venta.</div>';
      return;
    }

    var html = "";
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var total = n(r.unidades) * PRICE;
      var st = statusOf(r);
      html += '<div class="item">' +
        '<div class="top"><div class="name">' + escapeHtml(r.nombre) + '</div>' + badge(st) + '</div>' +
        '<div class="meta">' +
          '<b>' + r.unidades + '</b> natilla(s) · Total <b>' + money(total) + '</b><br>' +
          'Pagó <b>' + money(r.pago) + '</b> · Debe <b>' + money(r.debe) + '</b>' +
        '</div>' +
        (r.nota ? '<div class="note">' + escapeHtml(r.nota) + '</div>' : '') +
        '<div class="actions">' +
          '<button class="btn small gray" type="button" data-edit="' + r.id + '">Editar</button>' +
          '<button class="btn small red" type="button" data-del="' + r.id + '">Borrar</button>' +
        '</div>' +
      '</div>';
    }
    $("list").innerHTML = html;
  }

  $("btnSave").onclick = function () {
    var nombre = $("nombre").value.trim();
    var unidades = n($("unidades").value);
    var pago = n($("pago").value);
    var debe = n($("debe").value);
    var nota = $("nota").value.trim();
    var editId = $("editId").value;

    if (!nombre) { showMsg("Escribe el nombre", true); return; }
    if (unidades <= 0) { showMsg("Unidades debe ser mayor a 0", true); return; }

    var row = {
      id: editId || ("id_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8)),
      nombre: nombre,
      unidades: unidades,
      pago: pago,
      debe: debe,
      nota: nota,
      ts: Date.now()
    };

    if (editId) {
      var idx = -1;
      for (var i = 0; i < data.length; i++) if (data[i].id === editId) idx = i;
      if (idx >= 0) {
        row.ts = data[idx].ts || row.ts;
        data[idx] = row;
      } else {
        data.push(row);
      }
    } else {
      data.push(row);
    }

    if (!persist()) return;
    clearForm();
    render();
    showMsg("Guardado correctamente");
  };

  $("btnCancel").onclick = function () { clearForm(); };

  $("list").onclick = function (e) {
    var t = e.target;
    if (!t) return;
    var edit = t.getAttribute("data-edit");
    var del = t.getAttribute("data-del");

    if (edit) {
      var r = null;
      for (var i = 0; i < data.length; i++) if (data[i].id === edit) r = data[i];
      if (!r) return;
      $("editId").value = r.id;
      $("nombre").value = r.nombre;
      $("unidades").value = r.unidades;
      $("pago").value = r.pago;
      $("debe").value = r.debe;
      $("nota").value = r.nota || "";
      updateTotalView();
      $("formTitle").textContent = "Editar venta";
      $("btnSave").textContent = "Actualizar";
      $("btnCancel").style.display = "block";
      window.scrollTo(0, 0);
    }

    if (del) {
      if (!confirm("¿Borrar este registro?")) return;
      data = data.filter(function (x) { return x.id !== del; });
      if (!persist()) return;
      if ($("editId").value === del) clearForm();
      render();
      showMsg("Registro borrado");
    }
  };

  $("unidades").oninput = function () {
    updateTotalView();
    suggestDebe();
  };
  $("pago").oninput = suggestDebe;

  $("search").oninput = function () {
    filter = this.value;
    render();
  };

  loadData();
  render();
})();
</script>
</body>
</html>
