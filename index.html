<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Instagram Downloader</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:#000;
  color:#f5f5f7;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.box{
  width:min(100%,320px);
  padding:22px 18px 16px;
  background:#1c1c1e;
  border-radius:20px;
  text-align:center;
  border:1px solid rgba(255,255,255,0.06);
  box-shadow:0 16px 40px rgba(0,0,0,0.45);
}
.icon{
  width:48px;height:48px;border-radius:14px;margin:0 auto 12px;
  background:linear-gradient(135deg,#f58529,#dd2a7b 45%,#8134af 75%,#515bd4);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 24px rgba(221,42,123,0.35);
}
.icon svg{width:22px;height:22px}
h2{font-size:20px;font-weight:700;margin-bottom:4px}
.sub{font-size:12px;color:#8e8e93;margin-bottom:16px}
.input-box{position:relative;margin-bottom:12px}
input{
  width:100%;
  padding:14px 42px 14px 14px;
  border:none;
  border-radius:14px;
  background:#2c2c2e;
  color:#fff;
  font-size:15px;
  outline:none;
}
.clear-btn{
  position:absolute;right:12px;top:50%;
  transform:translateY(-50%);
  width:22px;height:22px;border-radius:50%;
  background:#3a3a3c;color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;cursor:pointer;
}
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  background:linear-gradient(135deg,#f58529,#dd2a7b 50%,#8134af);
}
button:disabled{opacity:0.55}
.loader{
  display:none;
  width:28px;height:28px;
  margin:16px auto 0;
  border-radius:50%;
  border:3px solid #2c2c2e;
  border-top-color:#dd2a7b;
  animation:spin 0.7s linear infinite;
}
.loader.on{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
#resultado{
  margin-top:14px;
  font-size:13px;
  color:#8e8e93;
}
#resultado video{
  width:100%;
  max-height:280px;
  border-radius:14px;
  margin-top:8px;
  background:#000;
}
#resultado a{
  display:block;
  margin-top:10px;
  padding:12px;
  border-radius:12px;
  background:#0a84ff;
  color:#fff;
  text-decoration:none;
  font-weight:700;
}
.footer{
  margin-top:16px;
  font-size:11px;
  color:#6c6c70;
}
</style>
</head>
<body>

<div class="box">
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none">
      <rect x="3" y="3" width="18" height="18" rx="5" stroke="#fff" stroke-width="1.8"/>
      <circle cx="12" cy="12" r="4" stroke="#fff" stroke-width="1.8"/>
      <circle cx="17.5" cy="6.5" r="1.2" fill="#fff"/>
    </svg>
  </div>

  <h2>Instagram Downloader</h2>
  <div class="sub">Pega el enlace y se busca solo</div>

  <div class="input-box">
    <input id="link" placeholder="Pegar enlace aquí">
    <span class="clear-btn" onclick="limpiar()">✕</span>
  </div>

  <button id="btn" onclick="descargar()">Descargar</button>
  <div class="loader" id="loader"></div>
  <div id="resultado"></div>
  <div class="footer">Sxgura Inc</div>
</div>

<script>
function limpiar(){
  document.getElementById("link").value = "";
  document.getElementById("resultado").innerHTML = "";
  document.getElementById("loader").className = "loader";
  document.getElementById("btn").disabled = false;
}

// MISMO sistema que tu HTML original
async function descargar(){
  var link = document.getElementById("link").value;
  var resDiv = document.getElementById("resultado");
  var loader = document.getElementById("loader");
  var btn = document.getElementById("btn");

  if(!link){
    alert("Pega un enlace");
    return;
  }

  resDiv.innerHTML = "";
  loader.className = "loader on";
  btn.disabled = true;

  try{
    var api = "https://api.deline.web.id/downloader/ig?url=" + encodeURIComponent(link);
    var res = await fetch(api);
    var data = await res.json();

    // igual que tu código original (sin ?. por si el WebView es viejo)
    var video = null;
    if(data && data.result && data.result.media && data.result.media.videos){
      video = data.result.media.videos[0];
    }

    if(video){
      resDiv.innerHTML =
        '<video controls playsinline src="'+video+'"></video>' +
        '<a href="'+video+'" target="_blank" download>Guardar</a>';
    }else{
      resDiv.innerHTML = "Sin resultados.";
    }

  }catch(e){
    resDiv.innerHTML = "Error";
  }

  loader.className = "loader";
  btn.disabled = false;
}

// búsqueda inteligente: al pegar se descarga sola
document.getElementById("link").addEventListener("paste", function(){
  setTimeout(function(){
    if(document.getElementById("link").value){
      descargar();
    }
  }, 80);
});
</script>

</body>
</html>
